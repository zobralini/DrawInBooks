name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Invoked through bash rather than as ./gradlew: the file mode is fixed
      # in git, but this way a future commit from a Windows checkout that loses
      # the executable bit again cannot break the build.
      - name: Build and test
        run: bash ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: drawinbooks-jar
          path: build/libs/*.jar
          if-no-files-found: error
